name: Boltz League backend referee regression tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate backend syntax
        run: |
          node --check service/worker/referee.mjs
          node --check service/worker/api.mjs
      - name: Test actual API worker with an in-memory database (no production writes)
        run: node service/scripts/test-referee-write.mjs
      - name: Build deployable private backend bundle
        working-directory: service
        run: node scripts/build.mjs
      - name: Package verified private backend for deployment
        uses: actions/upload-artifact@v4
        with:
          name: boltz-league-backend-worker
          path: service/dist/server/index.js
          if-no-files-found: error
      - name: Probe whether corrected private backend is live (read only)
        run: |
          node --input-type=module <<'JS'
          const root='https://boltz-league-matchday.jpiyady.chatgpt.site';
          for(const path of ['/referee/api/health','/api/health']){
            try{
              const result=await fetch(root+path,{headers:{Origin:'https://boltzleague.github.io'},signal:AbortSignal.timeout(12000)});
              const text=await result.text();
              const released=result.ok&&text.includes('boltz-ref-publish-2026-11-22');
              console.log((released?'DEPLOYED':'NOT YET VERIFIED')+' private backend '+path+': HTTP '+result.status+' '+text.slice(0,160));
            }catch(error){console.log('NOT YET VERIFIED private backend '+path+': '+error.message)}
          }
          JS
