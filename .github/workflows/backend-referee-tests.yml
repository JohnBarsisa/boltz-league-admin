name: Boltz League backend referee regression tests
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate backend syntax
        run: |
          node --check service/worker/referee.mjs
          node --check service/worker/api.mjs
      - name: Test actual API worker with an in-memory database (no production writes)
        run: node service/scripts/test-referee-write.mjs
      - name: Exercise gateway and persistent SQLite (no production writes)
        run: node service/scripts/test-sqlite-integration.mjs
      - name: Build deployable private backend bundle
        working-directory: service
        run: node scripts/build.mjs
      - name: Package verified private backend for deployment
        uses: actions/upload-artifact@v4
        with:
          name: boltz-league-backend-worker
          path: service/dist/server/index.js
          if-no-files-found: error
